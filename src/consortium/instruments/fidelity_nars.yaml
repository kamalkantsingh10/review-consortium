# Built-in placeholder for Persona-fidelity screening (story 3.1): the 14-item
# Negative Attitudes toward Robots Scale (Nomura, Suzuki, Kanda & Kato, 2006) with
# its subscale mapping (S1: interaction situations, S2: social influence, S3:
# emotions in interaction, reverse-keyed) and neutral placeholder text. Supply the
# real items as a user Instrument (copy templates/nars_instrument.yaml, see
# docs/INTERFACE.md) and select it with study.yaml screening.nars_instrument.
schema_version: 1
name: fidelity_nars
version: "0-draft"
draft: true
self_report: true
citation: >-
  Nomura, T., Suzuki, T., Kanda, T., & Kato, K. (2006). Measurement of negative
  attitudes toward robots. Interaction Studies, 7(3), 437-454.
instructions: >-
  Below are statements about robots. Answer as the person described above: how
  much do you agree with each one, from 1 (strongly disagree) to 5 (strongly agree)?
prompt_variants:
