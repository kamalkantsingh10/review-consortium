# Study configuration (schema_version 1). Field reference: docs/INTERFACE.md;
# JSON Schema: docs/schema/study.schema.json. Every default is written out here.
schema_version: 1

# The one Study seed; every other seed is derived from it.
seed: 1

# Instruments available to Tests: built-in names, or user Instruments in instruments/<name>.yaml.
# perception_cues (built-in: "Is the robot moving?", "Is there speech?") is for low-level
# checks in a kind: screening Test (consortium screen models).
instruments: [godspeed, pairwise_alive, presence, perception_cues]

# Models are keyed by id (m1, m2, ...), never by list position. Pin exact versions.
models:
  - id: m1
    provider: fake          # fake | gemini | qwen
    model: fake-1           # pinned version; empty or "...latest" is rejected
    settings:
      temperature: 0.7      # > 0
    max_output_tokens: 512
    limits:                 # what this Model accepts per request
      max_seconds: 600
      max_bytes: 20000000
      inline_base64: true   # media sent inline as base64 (counts 4/3 of the file size)
    fake:                   # provider: fake only; usage it reports per answer
      input_tokens: 0
      output_tokens: 0
      invalid_rate: 0       # 0-1: share of attempts answered invalidly (seeded per attempt)
      transient_rate: 0     # 0-1: share of attempts that hit a simulated rate limit / transport error
      refusal_rate: 0       # 0-1: share of attempts that are refused (Trial ends refused)
      fatal_rate: 0         # 0-1: share of attempts that fail fatally (Trial ends failed)
      fidelity: random      # random | faithful | unfaithful: how keyed self-report Items are answered (screen personas)
      perception: random    # random | faithful | unfaithful: how Items about Clips are answered (screen models)
  # A Gemini Model (uncomment to use; the key is read from GEMINI_API_KEY, never from here).
  # It also needs a matching prices.yaml entry, with media_tokens_per_s for its
  # media_resolution and fps (per-frame tokens x fps + 32 audio tokens/s), e.g. for low at 1 fps:
  #   m2:
  #     input_usd_per_mtok: "<USD per million input tokens>"
  #     output_usd_per_mtok: "<USD per million output tokens>"
  #     media_tokens_per_s: "98"    # 66 x 1 + 32
  # - id: m2
  #   provider: gemini
  #   model: gemini-3-flash-preview   # pinned version
  #   settings:
  #     temperature: 0.7
  #     seed_supported: true
  #     fps: 1                  # gemini only: frames sampled per second
  #     media_resolution: low   # gemini only: low | medium | high
  #     thinking_level: low     # gemini only: minimal | low | medium | high
  #     # api_key_env: GEMINI_API_KEY
  #   max_output_tokens: 1024
  #   limits:
  #     max_seconds: 600
  #     max_bytes: 2000000000
  #     inline_base64: false    # Clips go through the File API

# Canonical media profile every Clip is re-encoded to at ingest.
media:
  height: 480
  video_kbps: 400
  audio_kbps: 64
  fps: 25

session:
  practice_clips: 2         # Practice examples per Trial per Instrument
  repeats: 3
  max_retries: 2
  pairing: all_pairs
  retry:                    # rate limits and transport errors (study.yaml only)
    transient_retries: 3    # retries after a transient error, separate from max_retries
    backoff_initial_s: 2    # first wait; doubles per transient attempt, with seeded jitter
    backoff_max_s: 60       # cap on one wait (>= backoff_initial_s)

# Max in-flight calls per provider.
concurrency: 4

# Required; there are no code defaults.
thresholds:
  persona_fidelity_min: 0.8
  perception_min: 0.8       # screen models: a Model passes an Instrument at this pass ratio
  invalid_rate_max: 0.05
  leak_tolerance:           # resolution and fps must match exactly
    duration_s: 1.0
    loudness_lufs: 2.0

# Persona-fidelity screening (consortium screen personas): each Agent answers BFI-10 and,
# when nars_bands is not empty, the NARS Instrument below, fidelity_repeats times.
# fidelity_nars is a structure-only placeholder (draft); to use the published NARS items,
# copy the package template templates/nars_instrument.yaml to instruments/<name>.yaml,
# fill in the items and citation (Nomura et al., 2006), and set nars_instrument: <name>.
screening:
  fidelity_repeats: 1
  nars_instrument: fidelity_nars

# Persona frame: Big Five profiles x replicates x NARS bands, quota-balanced on four
# attributes. nars_bands: [] means no NARS band (6-line cards, nars: null). fraction: 1 (all 32 profiles), 1/2 (16, resolution V) or 1/4 (8,
# resolution III); replicates: 1-3 copies of each profile with fresh demographics.
# Trials scale with the Panel size, so a half fraction halves the cost.
personas:
  big_five:
    fraction: 1
    replicates: 1
  nars_bands: [low, high]
  quotas:
    # PLACEHOLDER — Kamal to confirm before the OLAF study
    age_band: ["18-29", "30-44", "45-59", "60+"]
    # PLACEHOLDER — Kamal to confirm before the OLAF study
    gender: [woman, man]
    # PLACEHOLDER — Kamal to confirm before the OLAF study
    cultural_region:
      - western_europe
      - eastern_europe
      - north_america
      - latin_america
      - east_asia
      - south_asia
      - middle_east_north_africa
      - sub_saharan_africa
    # PLACEHOLDER — Kamal to confirm before the OLAF study
    robot_experience: [none, some, regular]
